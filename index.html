          </div>
          <div class="card flex-1 flex flex-col" style="padding:0;overflow:hidden">
            ${!selectedAdminChat ? '<div class="flex-1 flex items-center justify-center text-dim text-sm">Select a treasurer</div>' :
            `<div class="p-3" style="border-bottom:1px solid var(--card-border)"><div class="font-medium text-sm">${selected.full_name}</div></div>

    // ============== PAYMENT HELPERS ==============
    function genReceiptNo() {
      const receipts = DB.get('receipts') || [];
      const nums = receipts.map(function(r) {
        var parts = r.receipt_no.split('-');
        return parseInt(parts[parts.length - 1], 10);
      }).filter(function(n) { return !isNaN(n); });
      var max = nums.length ? Math.max.apply(null, nums) : 0;
      var year = new Date().getFullYear();
      return 'RCP-' + year + '-' + String(max + 1).padStart(4, '0');
    }

    function genTransRef(method) {
      var ts = Date.now().toString(36).toUpperCase();
      var prefix = 'PMT';
      if (method === 'mobile_money') { prefix = 'MM'; }
      else if (method === 'bank') { prefix = 'BANK'; }
      else if (method === 'cash') { prefix = 'CSH'; }
      else if (method === 'payroll') { prefix = 'PRL'; }
      else if (method === 'qr') { prefix = 'QR'; }
      return prefix + '-' + ts + '-' + Math.random().toString(36).substring(2, 6).toUpperCase();
    }

    function calcPenalty(cycleId, paidAt) {
      var cycles = DB.get('payment_cycles') || [];
      var cycle = cycles.find(function(c) { return c.id === cycleId; });
      if (!cycle) return 0;
      var due = new Date(cycle.due_date);
      var paid = new Date(paidAt);
      if (paid <= due) return 0;
      var schedules = DB.get('payment_schedules') || [];
      var schedule = schedules.find(function(s) { return s.id === cycle.schedule_id; });
      if (!schedule || !schedule.penalty_type) return 0;
      var penaltyRules = DB.get('penalty_rules') || [];
      var rule = penaltyRules.find(function(r) { return r.schedule_id === schedule.id && r.enabled; });
      if (!rule) return 0;
      var graceEnd = cycle.grace_period_end ? new Date(cycle.grace_period_end) : new Date(due.getTime() + (schedule.grace_period_days || 0) * 86400000);
      if (paid <= graceEnd) return 0;
      if (schedule.penalty_type === 'fixed') {
        return Math.min(rule.value, rule.max_penalty || Infinity);
      }
      var daysLate = Math.floor((paid - graceEnd) / 86400000);
      if (daysLate <= 0) return 0;
      var total = daysLate * rule.value;
      return Math.min(total, rule.max_penalty || Infinity);
    }

      entries.push({ id: DB.genId(entries) + 1, payment_id: payment.id, account: 'savings_liability', debit: 0, credit: payment.amount, description: description || 'Member savings credit', entry_date: ts, created_at: ts });
      DB.set('journal_entries', entries);
      if (ledger) {
        ledger.total_balance = (ledger.total_balance || 0) + payment.amount;
        ledger.updated_at = ts;
        DB.set('generalLedger', ledger);
      }
    }

    function memberSubmitPayment(e) {
      e.preventDefault();

      if (!selectedPmtCycle || !selectedPmtMethod) { msgEl.className = 'msg-box msg-error show'; msgEl.textContent = 'Please select a cycle and payment method.'; return; }
      if (!amount || amount < 100) { msgEl.className = 'msg-box msg-error show'; msgEl.textContent = 'Minimum payment is UGX 100.'; return; }
      var cycles = DB.get('payment_cycles') || [];
      var cycle = cycles.find(function(c) { return c.id === selectedPmtCycle; });
      if (!cycle) { msgEl.className = 'msg-box msg-error show'; msgEl.textContent = 'Cycle not found.'; return; }
      var scheds = DB.get('payment_schedules') || [];
      var schedule = scheds.find(function(s) { return s.id === cycle.schedule_id; });
      var now = new Date().toISOString();
      var penalty = calcPenalty(selectedPmtCycle, now);
      var totalAmount = amount + penalty;
      var mobileNumber = '';
      var bankRef = '';
      if (selectedPmtMethod === 'mtn' || selectedPmtMethod === 'airtel') {
        mobileNumber = (document.getElementById('pm-mobile') ? document.getElementById('pm-mobile').value.trim() : '');
        if (!mobileNumber) { msgEl.className = 'msg-box msg-error show'; msgEl.textContent = 'Please enter your mobile number.'; return; }
      } else if (selectedPmtMethod === 'bank' || selectedPmtMethod === 'payroll') {
        bankRef = (document.getElementById('pm-ref') ? document.getElementById('pm-ref').value.trim() : '');
        if (!bankRef) { msgEl.className = 'msg-box msg-error show'; msgEl.textContent = 'Please enter reference details.'; return; }
      }
      var mobileProvider = '';
      if (selectedPmtMethod === 'mtn') mobileProvider = 'mtn';
      else if (selectedPmtMethod === 'airtel') mobileProvider = 'airtel';
      var pmtMethod = selectedPmtMethod === 'mtn' || selectedPmtMethod === 'airtel' ? 'mobile_money' : selectedPmtMethod;

      var payments = DB.get('payments') || [];
      var receiptNo = genReceiptNo();
      var transRef = genTransRef(pmtMethod);
      var payment = { id: DB.genId(payments), cycle_id: selectedPmtCycle, user_id: currentUser.id, amount: amount, payment_method: pmtMethod, mobile_provider: mobileProvider, mobile_number: mobileNumber, bank_reference: bankRef, transaction_ref: transRef, receipt_no: receiptNo, status: 'completed', paid_at: now, recorded_by: currentUser.id, penalty_amount: penalty, created_at: now };
      payments.push(payment);
      DB.set('payments', payments);

      var receipts = DB.get('receipts') || [];
      var cycleName = cycle.name;
      receipts.push({ id: DB.genId(receipts), receipt_no: receiptNo, payment_id: payment.id, user_id: currentUser.id, amount: totalAmount, payment_method: pmtMethod, purpose: cycleName + ' payment', member_name: currentUser.full_name, issued_at: now });
      DB.set('receipts', receipts);

      var savings = DB.get('savings');

      DB.set('savings', savings);

      var tx = DB.get('transactions');
      tx.push({ id: DB.genId(tx), user_id: currentUser.id, type: 'deposit', amount: totalAmount, balance_before: 0, balance_after: totalAmount, description: 'Payment - ' + cycleName, created_by: currentUser.id, created_at: now });
      DB.set('transactions', tx);

      postPaymentJournal(payment, 'Payment - ' + cycleName);

      pmtFlashMsg = 'Payment of ' + formatUGX(totalAmount) + ' completed! Receipt: <strong>' + receiptNo + '</strong>' + (penalty > 0 ? '<br><span class="text-warning">Late penalty: ' + formatUGX(penalty) + '</span>' : '');

      selectedPmtMethod = null;
      renderMemberPayments();
    }

            else if (p.status === 'failed') statusBadge = 'pmt-status failed';
            rows += '<tr><td class="font-medium text-xs">' + (member ? member.full_name : 'User #' + p.user_id) + '</td>'
              + '<td class="text-xs text-dim">' + (cycle ? cycle.name : 'Cycle #' + p.cycle_id) + '</td>'
              + '<td class="font-medium">' + formatUGX(p.amount) + '</td>'
              + '<td class="text-xs" style="text-transform:capitalize">' + p.payment_method.replace(/_/g, ' ') + '</td>'
              + '<td class="text-xs text-dim">' + (p.penalty_amount > 0 ? '<span class="text-warning">' + formatUGX(p.penalty_amount) + '</span>' : '—') + '</td>'
              + '<td><span class="' + statusBadge + '">' + p.status + '</span></td>'
              + '<td class="text-xs text-dim">' + formatDate(p.paid_at || p.created_at) + '</td></tr>';
          });
        }
        contentHtml = '<div class="card"><div class="flex justify-between items-center mb-3"><div class="section-title" style="margin-bottom:0"><i class="fas fa-clock-rotate-left"></i> Payment History</div><span class="text-xs text-dim">' + payments.length + ' total</span></div>'
          + '<div class="table-wrap" style="max-height:400px;overflow-y:auto"><table><thead><tr><th>Member</th><th>Cycle</th><th>Amount</th><th>Method</th><th>Penalty</th><th>Status</th><th>Date</th></tr></thead><tbody>' + rows + '</tbody></table></div></div>';
      }

      el.innerHTML = '<div class="page-title">Payment Management</div>' + tabHtml + contentHtml;

      if (treasurerPmtTab === 'record') {
        var methodSel = document.getElementById('tp-method');
        if (methodSel) {
          methodSel.addEventListener('change', function() {
            var refField = document.getElementById('tp-ref-field');
            if (refField) {
              refField.style.display = (this.value === 'mobile_money' || this.value === 'bank') ? 'block' : 'none';
            }
          });
        }
      }
    }

    function treasurerRecordPayment(e) {
      e.preventDefault();
      var msgEl = document.getElementById('tp-msg');
      var memberId = parseInt(document.getElementById('tp-member').value);
      var cycleId = parseInt(document.getElementById('tp-cycle').value);
      var amount = parseFloat(document.getElementById('tp-amount').value);
      var method = document.getElementById('tp-method').value;
      var reference = document.getElementById('tp-reference') ? document.getElementById('tp-reference').value.trim() : '';
      if (!memberId || !cycleId || !amount || !method) { msgEl.className = 'msg-box msg-error show'; msgEl.textContent = 'All fields required.'; return; }
      var cycles = DB.get('payment_cycles') || [];
      var cycle = cycles.find(function(c) { return c.id === cycleId; });
      if (!cycle) { msgEl.className = 'msg-box msg-error show'; msgEl.textContent = 'Cycle not found.'; return; }
      var now = new Date().toISOString();
      var penalty = calcPenalty(cycleId, now);
      var totalAmount = amount + penalty;
      var payments = DB.get('payments') || [];
      var receiptNo = genReceiptNo();
      var transRef = genTransRef(method);
      var payment = { id: DB.genId(payments), cycle_id: cycleId, user_id: memberId, amount: amount, payment_method: method, transaction_ref: transRef, receipt_no: receiptNo, status: 'completed', paid_at: now, recorded_by: currentUser.id, penalty_amount: penalty, created_at: now, mobile_number: (method === 'mobile_money' ? reference : ''), bank_reference: (method === 'bank' ? reference : '') };
      payments.push(payment);
      DB.set('payments', payments);
      var users = DB.get('users') || [];
      var member = users.find(function(u) { return u.id === memberId; });
      var receipts = DB.get('receipts') || [];
      receipts.push({ id: DB.genId(receipts), receipt_no: receiptNo, payment_id: payment.id, user_id: memberId, amount: totalAmount, payment_method: method, purpose: cycle.name + ' payment', member_name: member ? member.full_name : 'Member', issued_at: now });
      DB.set('receipts', receipts);
      var savings = DB.get('savings');
      savings.push({ id: DB.genId(savings), user_id: memberId, amount: totalAmount, deposit_date: now, description: 'Payment - ' + cycle.name + ' (recorded by treasurer)', recorded_by: currentUser.id });
      DB.set('savings', savings);
      var tx = DB.get('transactions');
      tx.push({ id: DB.genId(tx), user_id: memberId, type: 'deposit', amount: totalAmount, balance_before: 0, balance_after: totalAmount, description: 'Payment - ' + cycle.name + ' (treasurer)', created_by: currentUser.id, created_at: now });
      DB.set('transactions', tx);
      postPaymentJournal(payment, 'Payment - ' + cycle.name + ' (treasurer recorded)');
      msgEl.className = 'msg-box msg-success show';
      msgEl.innerHTML = 'Payment of ' + formatUGX(totalAmount) + ' recorded for ' + (member ? member.full_name : 'member') + '. Receipt: <strong>' + receiptNo + '</strong>' + (penalty > 0 ? '<br><span class="text-warning">Late penalty: ' + formatUGX(penalty) + '</span>' : '');
      renderTreasurerPayments();
    }

    // ============== TREASURER SCHEDULES ==============
    function renderTreasurerSchedules() {
      if (currentUser && currentUser.role === 'treasurer') schedElId = 'view-treasurer-schedules';
      var el = document.getElementById(schedElId);
      var scheds = DB.get('payment_schedules') || [];
      var cycles = DB.get('payment_cycles') || [];

      var listHtml = '';
      if (scheds.length === 0) {
        listHtml = '<div class="card text-center py-8"><i class="fas fa-calendar text-4xl text-dim mb-3"></i><p class="text-muted text-sm">No schedules created yet.</p></div>';
      } else {
        listHtml = '<div class="space-y-3">';
        scheds.forEach(function(s) {
          var cycleCount = cycles.filter(function(c) { return c.schedule_id === s.id; }).length;
          var statusCls = s.status === 'active' ? 'badge-green' : 'badge-gray';
          var cycleList = cycles.filter(function(c) { return c.schedule_id === s.id; }).map(function(c) {
            return '<div class="flex justify-between items-center text-xs py-1" style="border-bottom:1px solid var(--card-border)"><span>' + c.name + '</span><span class="' + (c.status === 'open' ? 'text-green' : 'text-dim') + '">' + formatUGX(c.amount) + ' — ' + c.status + '</span></div>';
          }).join('');

          listHtml += '<div class="schedule-card">'
            + '<div class="flex justify-between items-start mb-2"><div><div class="font-bold text-sm">' + s.name + '</div><div class="text-xs text-dim">' + formatUGX(s.amount) + ' / ' + s.frequency + ' | Due day: ' + s.due_day + ' | Grace: ' + s.grace_period_days + 'd</div></div><span class="badge ' + statusCls + '">' + s.status + '</span></div>'
            + '<div class="flex gap-2 mb-2">'
            + '<button class="btn-outline text-xs" onclick="createCycleFromSchedule(' + s.id + ')"><i class="fas fa-plus"></i> Create Cycle</button>'
            + '<button class="btn-outline text-xs" onclick="toggleScheduleStatus(' + s.id + ')"><i class="fas fa-' + (s.status === 'active' ? 'pause' : 'play') + '"></i> ' + (s.status === 'active' ? 'Pause' : 'Activate') + '</button>'
            + '</div>'
            + (cycleList ? '<div class="mt-1">' + cycleList + '</div>' : '<div class="text-xs text-dim mt-1">No cycles yet.</div>')
            + '</div>';
        });
        listHtml += '</div>';
      }

      el.innerHTML = ''
        + '<div class="page-title">Schedule Management</div>'
        + '<div id="ts-msg" class="msg-box"></div>'
        + '<div class="card mb-4"><div class="section-title" style="margin-bottom:0.5rem"><i class="fas fa-plus"></i> Create New Schedule</div>'
        + '<form onsubmit="treasurerCreateSchedule(event)" class="space-y-3">'
        + '<div class="grid-2"><div><label class="text-xs text-muted mb-1" style="display:block">Name</label><input type="text" id="ts-name" class="input-field" placeholder="e.g. Monthly Savings" required></div>'
        + '<div><label class="text-xs text-muted mb-1" style="display:block">Frequency</label><select id="ts-freq" class="input-field"><option value="monthly">Monthly</option><option value="weekly">Weekly</option><option value="quarterly">Quarterly</option><option value="yearly">Yearly</option></select></div></div>'
        + '<div class="grid-3"><div><label class="text-xs text-muted mb-1" style="display:block">Amount (UGX)</label><input type="number" id="ts-amount" class="input-field" placeholder="e.g. 100000" min="100" required></div>'
        + '<div><label class="text-xs text-muted mb-1" style="display:block">Due Day</label><input type="number" id="ts-due" class="input-field" placeholder="e.g. 25" min="1" max="28" required></div>'
        + '<div><label class="text-xs text-muted mb-1" style="display:block">Grace (days)</label><input type="number" id="ts-grace" class="input-field" value="5" min="0" max="30"></div></div>'
        + '<div class="grid-3"><div><label class="text-xs text-muted mb-1" style="display:block">Penalty Type</label><select id="ts-ptype" class="input-field"><option value="daily">Daily</option><option value="fixed">Fixed</option><option value="none">None</option></select></div>'
        + '<div><label class="text-xs text-muted mb-1" style="display:block">Penalty Value</label><input type="number" id="ts-pval" class="input-field" value="1000" min="0"></div>'
        + '<div><label class="text-xs text-muted mb-1" style="display:block">Max Penalty</label><input type="number" id="ts-pmax" class="input-field" value="50000" min="0"></div></div>'
        + '<button type="submit" class="btn-primary w-full justify-center"><i class="fas fa-save"></i> Create Schedule</button>'
        + '</form></div>'
        + '<div class="section-title mb-3"><i class="fas fa-list"></i> Existing Schedules</div>'
        + listHtml;
    }

    function treasurerCreateSchedule(e) {
      e.preventDefault();
      var msgEl = document.getElementById('ts-msg');
      var name = document.getElementById('ts-name').value.trim();
      var freq = document.getElementById('ts-freq').value;
      var amount = parseFloat(document.getElementById('ts-amount').value);
      var dueDay = parseInt(document.getElementById('ts-due').value);
      var grace = parseInt(document.getElementById('ts-grace').value) || 0;
      var ptype = document.getElementById('ts-ptype').value;
      var pval = parseFloat(document.getElementById('ts-pval').value) || 0;
      var pmax = parseFloat(document.getElementById('ts-pmax').value) || 0;
      if (!name || !amount || !dueDay) { msgEl.className = 'msg-box msg-error show'; msgEl.textContent = 'Name, amount, and due day are required.'; return; }
      var scheds = DB.get('payment_schedules') || [];
      scheds.push({ id: DB.genId(scheds), name: name, frequency: freq, amount: amount, due_day: dueDay, grace_period_days: grace, penalty_type: ptype === 'none' ? null : ptype, penalty_value: ptype !== 'none' ? pval : 0, max_penalty: ptype !== 'none' ? pmax : 0, applies_to_all: true, status: 'active', created_by: currentUser.id, created_at: new Date().toISOString() });
      DB.set('payment_schedules', scheds);
      if (ptype !== 'none') {
        var rules = DB.get('penalty_rules') || [];
        var newSchedId = DB.genId(scheds) - 1;
        rules.push({ id: DB.genId(rules), schedule_id: newSchedId, type: ptype, value: pval, max_penalty: pmax, enabled: true });
        DB.set('penalty_rules', rules);
      }
      msgEl.className = 'msg-box msg-success show';
      msgEl.textContent = 'Schedule "' + name + '" created successfully!';
      renderTreasurerSchedules();
    }

    function createCycleFromSchedule(scheduleId) {
      var scheds = DB.get('payment_schedules') || [];
      var sched = scheds.find(function(s) { return s.id === scheduleId; });
      if (!sched) return;
      var now = new Date();
      var monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      var monthName = monthNames[now.getMonth()];
      var year = now.getFullYear();
      var dueDate = new Date(year, now.getMonth(), sched.due_day);
      if (dueDate < now) {
        dueDate.setMonth(dueDate.getMonth() + 1);
      }
      var graceEnd = new Date(dueDate.getTime() + (sched.grace_period_days || 0) * 86400000);
      var cycles = DB.get('payment_cycles') || [];
      cycles.push({ id: DB.genId(cycles), schedule_id: scheduleId, name: monthName + ' ' + year + ' Savings', amount: sched.amount, due_date: dueDate.toISOString(), grace_period_end: graceEnd.toISOString(), status: 'open', created_by: currentUser.id, created_at: now.toISOString() });
      DB.set('payment_cycles', cycles);
      var msgEl = document.getElementById('ts-msg');
      if (msgEl) { msgEl.className = 'msg-box msg-success show'; msgEl.textContent = 'Cycle created for ' + monthName + ' ' + year + '!'; }
      renderTreasurerSchedules();
    }

    function toggleScheduleStatus(scheduleId) {
      var scheds = DB.get('payment_schedules') || [];
      var sched = scheds.find(function(s) { return s.id === scheduleId; });
      if (!sched) return;
      sched.status = sched.status === 'active' ? 'paused' : 'active';
      DB.set('payment_schedules', scheds);
      renderTreasurerSchedules();
    }

    // ============== ADMIN PAYMENTS / SCHEDULES ==============
    function renderAdminPayments() {
      pmtElId = 'view-admin-payments';
      treasurerPmtTab = 'dashboard';
      renderTreasurerPayments();
    }

    function renderAdminSchedules() {
      schedElId = 'view-admin-schedules';
      renderTreasurerSchedules();
    }

    // ============== APP BOOT ==============
    function buildApp() {
      const app = document.getElementById('app');
      app.innerHTML = `
        <aside id="sidebar" class="no-print" style="display:none"></aside>
        <div id="main-area">
          <div id="page-content">
            <div id="view-login" class="view"></div>
            <div id="view-member" class="view"></div>
            <div id="view-member-savings" class="view"></div>
            <div id="view-member-loans" class="view"></div>
            <div id="view-member-announcements" class="view"></div>
            <div id="view-member-chat" class="view"></div>
            <div id="view-treasurer" class="view"></div>
            <div id="view-treasurer-savings" class="view"></div>
            <div id="view-treasurer-loans" class="view"></div>
            <div id="view-treasurer-ledger" class="view"></div>
            <div id="view-treasurer-transactions" class="view"></div>
            <div id="view-treasurer-reports" class="view"></div>
            <div id="view-treasurer-chat" class="view"></div>
            <div id="view-admin-savings" class="view"></div>
            <div id="view-admin-loans" class="view"></div>
            <div id="view-admin" class="view"></div>
            <div id="view-admin-users" class="view"></div>
            <div id="view-admin-announcements" class="view"></div>
            <div id="view-admin-chat" class="view"></div>
            <div id="view-member-payments" class="view"></div>
            <div id="view-member-receipts" class="view"></div>
            <div id="view-treasurer-payments" class="view"></div>
            <div id="view-treasurer-schedules" class="view"></div>
            <div id="view-admin-schedules" class="view"></div>
            <div id="view-admin-payments" class="view"></div>
          </div>
        </div>
        <nav id="mobile-nav" class="no-print" style="display:none"></nav>
      `;
      initData();

      // Restore session from localStorage
      var saved = DB.get('auth_user');
      if (saved && DB.get('users').find(function(u){ return u.id === saved.id && u.role === saved.role; })) {
        currentUser = saved;
        renderSidebar();
        renderMobileNav();
        var savedPage = DB.get('auth_page') || saved.role;
        navigate(savedPage);
      } else {
        navigate('login');
      }
    }

    setInterval(() => {
      if (currentUser && currentPage === 'member-chat') renderMemberChat();
      if (currentUser && currentPage === 'treasurer-chat') renderTreasurerChat();
      if (currentUser && currentPage === 'admin-chat') renderAdminChat();
    }, 10000);

    buildApp();
  </script>
</body>
